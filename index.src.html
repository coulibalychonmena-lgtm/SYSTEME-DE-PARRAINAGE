<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parrainage SRIT 1A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1147;--bg2:#2d1a6e;--pink:#ff3d8b;--sun:#ffc93c;--mint:#2de2b0;--ink:#fff;--card:#ffffff14;--line:#ffffff30}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg) 60%) fixed;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.float{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.float span{position:absolute;bottom:-60px;opacity:.5;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:64px 16px 40px}
h1{font-family:'Bungee',Impact,sans-serif;font-size:clamp(34px,9vw,68px);line-height:1;text-align:center;color:var(--sun);text-shadow:3px 3px 0 var(--pink),6px 6px 0 #0006;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.sub{text-align:center;margin:10px 0 18px;font-weight:600;opacity:.85}
.machine{background:linear-gradient(#ffffff1c,#ffffff0a);border:3px solid var(--sun);border-radius:28px;padding:18px 14px 22px;box-shadow:0 0 0 6px #ffc93c33,0 20px 60px #0008;text-align:center}
.stage{position:relative;height:200px;margin-bottom:16px;border-radius:18px;background:#0d0830;border:2px solid var(--line);overflow:hidden;perspective:1000px;display:flex;align-items:center;justify-content:center}
.scale{width:200px;height:90px;transform-style:preserve-3d;transform:scale(var(--s,1))}
.ring{position:absolute;inset:0;transform-style:preserve-3d}
.card3{position:absolute;left:0;top:0;width:200px;height:90px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border-radius:14px;font-weight:800;font-size:15px;line-height:1.15;text-transform:uppercase;color:#1b1147;backface-visibility:hidden;border:3px solid #fff;box-shadow:0 0 20px #0007}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:'Bungee',Impact,sans-serif;font-size:130px;color:var(--sun);text-shadow:4px 4px 0 var(--pink);background:#0d0830cc;z-index:3}
#count.on{display:flex}
#count b{animation:cnt 1s ease-out}
@keyframes cnt{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.7);opacity:.2}}
.form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input,select{flex:1 1 240px;min-width:0;font:inherit;font-weight:600;font-size:18px;padding:15px 18px;border-radius:16px;border:3px solid var(--line);background:#0d0830;color:#fff;outline:none}
input:focus-visible{border-color:var(--mint)}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:16px;padding:15px 22px;color:#1b1147;background:var(--sun);box-shadow:0 5px 0 #b88a00}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b88a00}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
button:disabled{opacity:.5;cursor:wait}
#go{background:var(--pink);color:#fff;box-shadow:0 5px 0 #a3185a;font-family:'Bungee',Impact,sans-serif;font-size:19px}
.msg{min-height:24px;margin-top:12px;font-weight:600;color:var(--sun)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
#banner{position:fixed;left:50%;top:50%;z-index:51;width:min(92vw,620px);transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,var(--pink),#7b2dff);border:4px solid var(--sun);border-radius:30px;padding:28px 20px;text-align:center;box-shadow:0 0 80px #ff3d8bcc;pointer-events:none}
#banner.show{animation:pop 5s ease forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg)}8%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg)}14%,90%{transform:translate(-50%,-50%) scale(1) rotate(0)}100%{transform:translate(-50%,-50%) scale(0)}}
#banner .big{font-family:'Bungee',Impact,sans-serif;font-size:clamp(26px,7vw,44px);color:var(--sun)}
#banner .who{font-size:clamp(20px,5.5vw,32px);font-weight:800;margin:6px 0;text-transform:uppercase}
#banner .par{font-family:'Bungee',Impact,sans-serif;font-size:clamp(22px,6vw,38px);color:#fff;background:#0007;border-radius:16px;padding:12px;margin-top:10px}
.fab{position:fixed;top:calc(12px + env(safe-area-inset-top));z-index:60;padding:8px 14px;font-size:20px;letter-spacing:2px;background:var(--card);color:#fff;box-shadow:none;border:2px solid var(--line)}
#menuBtn{left:12px;font-family:'Bungee',Impact,sans-serif}
#mute{right:12px}
#drawer{position:fixed;inset:0 0 0 auto;width:min(100%,560px);z-index:70;background:#150d3a;border-left:3px solid var(--sun);transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#drawer.open{transform:none}
#dHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
#dHead b{font-family:'Bungee',Impact,sans-serif;color:var(--sun);font-size:20px}
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.tabs button{padding:8px 14px;font-size:14px;background:var(--card);color:#fff;box-shadow:none;white-space:nowrap}
.tabs button.on{background:var(--mint);color:#1b1147}
#dBody{flex:1;overflow-y:auto;padding:4px 14px 30px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px}
.stat b{display:block;font-family:'Bungee',Impact,sans-serif;font-size:24px;color:var(--mint);overflow-wrap:anywhere}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item small{display:block;opacity:.7;font-weight:400}
.item.off .t{opacity:.45;text-decoration:line-through}
.sm{padding:6px 10px;font-size:13px;border-radius:10px;box-shadow:0 3px 0 #b88a00}
.sm.r{background:#ff6b6b;box-shadow:0 3px 0 #b23030}
.sm.g{background:var(--mint);box-shadow:0 3px 0 #139a77}
.cnt{background:var(--pink);color:#fff;border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px}
.big-btn{display:block;width:100%;margin:10px 0;background:var(--mint);box-shadow:0 5px 0 #139a77}
.big-btn.r{background:#ff6b6b;box-shadow:0 5px 0 #b23030}
.add{display:flex;gap:8px;margin:10px 0}
.add input{font-size:15px;padding:10px 12px;border-width:2px}
.hint{opacity:.7;font-size:13px;margin:8px 0}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;color:#000;background:#fff}}
#printArea{display:none}
@media print{#printArea{display:block}}
@media (prefers-reduced-motion:reduce){.float,h1{animation:none}.float{display:none}}
</style>
</head>
<body>
<div class="float" id="float" aria-hidden="true"></div>
<button id="menuBtn" class="fab" aria-label="Ouvrir le menu">///</button>
<button id="mute" class="fab" aria-label="Activer ou couper le son">🔊</button>
<main>
  <h1>Parrainage<br>SRIT 1A</h1>
  <p class="sub">Entre ton nom et découvre ton parrain ou ta marraine 🎰</p>
  <section class="machine" aria-label="Tirage">
    <div class="stage" id="stage">
      <div class="scale" id="scale"><div class="ring" id="ring"></div></div>
      <div id="count" aria-live="assertive"></div>
    </div>
    <div class="form" id="form">
      <input id="name" type="text" placeholder="Nom et prénoms du filleul" autocomplete="off" maxlength="80" aria-label="Nom du filleul">
      <button id="go">Lancer 🎉</button>
    </div>
    <div class="msg" id="msg" role="alert"></div>
  </section>
</main>

<aside id="drawer" aria-label="Menu" aria-hidden="true">
  <div id="dHead"><b>Menu</b><button class="sm r" id="dClose">Fermer ✕</button></div>
  <div class="tabs" id="tabs">
    <button data-t="stats">Statistiques</button><button data-t="par">Parrains</button><button data-t="fil">Filleuls</button><button data-t="exp">Exporter</button><button data-t="adm">Réglages</button>
  </div>
  <div id="dBody"></div>
</aside>

<canvas id="fx"></canvas>
<div id="banner" role="status"><div class="big">🎊 Félicitations ! 🎊</div><div class="who" id="bWho"></div><div>Ton parrain / ta marraine :</div><div class="par" id="bPar"></div></div>
<div id="printArea"></div>

<script>
(function(){
'use strict';
var INIT=["ABOIDJE ALLOUKO ANGE SAMUEL SOSTHENE","AHEMED BEN ANGE MALICK ISMAEL","AKA CHO MARIE-ROSELINE EMMANUELLA","AMANI ISRAEL MOUAYE ALEX DESIRE","ATTEY BONI CHRIST ARIANE","BARRO MUHAMMAD","BEDY MARC ARTHUR AKE","COULIBALY CHONMENA","DIABY IDRYS JANUS","DJRO LOUIS","GNAMOU AKO MARIE PAULE ORNELLA","GOLY ATOWLA JEAN JUNIOR LEBON","HOUATTARA MOUSSA","KONE ZANA ISMAEL","KOUAME MEA BROU MARIE REINE","MAHOUENA LEMUEL WILFRIED","N'DRI IREL KEVAN MANASSE","N'GUESSAN MIHAN SIÈ HENNOCK DESPROGES","OKPEKON LAURENA MARIE-JOELLE","OLADOYE KUDUSS OYEWOLE","OUATTARA MOHAMED-YASSINE LASSAMGA PETIN","SANOGO YELE AMINATA SHADIA","SERIKPA ARMAND BERANGER","SOUMAHORO CHIAKA","SYLLA ABDOUL-AZIZ","THEBY MIN-MOYET MAELYS MARIE CAMELYA","TIEGBAOU YVANN ELIE","YAO BECELY MARC EMMANUEL"];
var KEY='srit1a-parrainage-v2',SEC={h:'__CODE_HASH__',s:'__CODE_SALT__',i:+'__CODE_ITER__'},N=10,R=262,COL=['#ffc93c','#2de2b0','#ff9ac6','#9fd8ff','#c8a8ff'];
var $=function(i){return document.getElementById(i)};
var S=load(),busy=false,muted=false,actx=null,tab='stats';

function fresh(){var p=INIT.map(function(n,i){return {id:i+1,name:n,on:true}});return {parrains:p,deck:shuffle(p.map(function(x){return x.id})),tour:1,rows:[],nextId:p.length+1}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.parrains)&&Array.isArray(s.deck)&&Array.isArray(s.rows))return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rnd(n){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toLowerCase()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function par(id){for(var i=0;i<S.parrains.length;i++)if(S.parrains[i].id===id)return S.parrains[i];return null}
function nm(id){var p=par(id);return p?p.name:'(supprimé)'}
function active(){return S.parrains.filter(function(p){return p.on}).map(function(p){return p.id})}
function h(s){var x=5381;s='srit|'+s;for(var i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return String(x)}
function stamp(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())}

/* Fond */
(function(){var e=['🎉','🎊','⭐','🎁','✨','🎈','🏆','💫'],f=$('float');for(var i=0;i<18;i++){var s=document.createElement('span');s.textContent=e[i%e.length];s.style.left=(Math.random()*100)+'%';s.style.fontSize=(18+Math.random()*30)+'px';s.style.animationDuration=(9+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*15)+'s';f.appendChild(s)}})();

/* Son */
function beep(fq,d,type,vol){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.value=fq;g.gain.value=vol||.04;g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function fanfare(){[523,659,784,1047,784,1047,1319].forEach(function(f,i){setTimeout(function(){beep(f,.25,'triangle',.08)},i*130)})}
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};

/* Confettis */
var cv=$('fx'),cx=cv.getContext('2d'),parts=[],raf=0,endAt=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight;var s=Math.min(1,(innerWidth-60)/520);$('scale').style.setProperty('--s',s)}fit();addEventListener('resize',fit);
function burst(x,y,n){var c=['#ff3d8b','#ffc93c','#2de2b0','#7b2dff','#4dc3ff','#fff'];for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=6+Math.random()*12;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-8,w:6+Math.random()*8,h:10+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:c[i%c.length]})}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(function(p){p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});parts=parts.filter(function(p){return p.y<cv.height+40});if(Date.now()<endAt||parts.length){raf=requestAnimationFrame(loop)}else{cx.clearRect(0,0,cv.width,cv.height);raf=0}}
function celebrate(){endAt=Date.now()+5000;var t=0,iv=setInterval(function(){burst(Math.random()*cv.width,cv.height*.9,45);burst(0,cv.height*.7,25);burst(cv.width,cv.height*.7,25);if(++t>=14||Date.now()>endAt-600)clearInterval(iv)},330);burst(cv.width/2,cv.height/2,140);if(!raf)loop()}

/* Anneau rotatif */
var ring=$('ring'),faces=[],ang=0,vel=28,target=28,fast=false,last=performance.now(),lastSeg=0;
for(var i=0;i<N;i++){var c=document.createElement('div');c.className='card3';c.style.background=COL[i%COL.length];c.style.transform='rotateY('+(i*360/N)+'deg) translateZ('+R+'px)';ring.appendChild(c);faces.push(c)}
function idleFaces(){faces.forEach(function(f){f.textContent='🎁 ?'})}
function spinFaces(){var ids=shuffle(active());faces.forEach(function(f,i){f.textContent=ids.length?nm(ids[i%ids.length]):'?'})}
function frame(t){var dt=Math.min(.05,(t-last)/1000);last=t;vel=target+(vel-target)*Math.exp(-dt*(fast?1.0:3));ang+=vel*dt;ring.style.transform='translateZ(-'+R+'px) rotateY('+(-ang)+'deg)';var seg=Math.floor(ang/(360/N));if(seg!==lastSeg){lastSeg=seg;if(fast&&vel>150)beep(260+Math.min(vel,1200)/3,.04,'square',.025)}requestAnimationFrame(frame)}
idleFaces();requestAnimationFrame(frame);

/* Tirage */
function warn(t){$('msg').textContent='⚠️ '+t;var f=$('form');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');beep(160,.25,'sawtooth',.06)}
function nextDraw(){var deck=S.deck.filter(function(id){var p=par(id);return p&&p.on}),tour=S.tour;if(!deck.length){deck=shuffle(active());if(!deck.length)return null;tour++;var lr=S.rows.length?S.rows[S.rows.length-1].pid:-1;if(deck.length>1&&deck[deck.length-1]===lr){var j=rnd(deck.length-1),t=deck[j];deck[j]=deck[deck.length-1];deck[deck.length-1]=t}}var pid=deck.pop();return {pid:pid,deck:deck,tour:tour}}
function draw(){
  if(busy)return;
  var inp=$('name'),name=inp.value.replace(/\s+/g,' ').trim();
  if(name.length<2)return warn('Entre ton nom complet.');
  if(S.rows.some(function(r){return norm(r.filleul)===norm(name)}))return warn('Ce nom a déjà un parrain.');
  var d=nextDraw();if(!d)return warn('Aucun parrain actif.');
  $('msg').textContent='';busy=true;$('go').disabled=true;inp.disabled=true;
  spinFaces();fast=true;vel=1500;target=150;
  setTimeout(function(){var n=3,c=$('count');c.classList.add('on');
    (function cd(){if(n===0){c.classList.remove('on');return reveal()}c.innerHTML='<b>'+n+'</b>';beep(440+(3-n)*120,.15,'triangle',.07);n--;setTimeout(cd,1000)})()
  },3200);
  function reveal(){
    S.deck=d.deck;S.tour=d.tour;S.rows.push({filleul:name,pid:d.pid,tour:d.tour,at:new Date().toISOString()});save();
    $('bWho').textContent=name;$('bPar').textContent=nm(d.pid);
    var b=$('banner');b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
    celebrate();fanfare();inp.value='';if($('drawer').classList.contains('open'))view();
    setTimeout(function(){fast=false;target=28;idleFaces();busy=false;$('go').disabled=false;inp.disabled=false;inp.focus()},5000);
  }
}
$('go').onclick=draw;
$('name').addEventListener('keydown',function(e){if(e.key==='Enter')draw()});

/* Menu protégé */
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
function derive(v){var e=new TextEncoder();return crypto.subtle.importKey('raw',e.encode(v),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:e.encode(SEC.s),iterations:SEC.i},k,256)}).then(hex)}
function unlock(){
  if(SEC.h.indexOf('__')===0){alert('Accès indisponible : configuration manquante.');return Promise.resolve(false)}
  var v=prompt('Entre le code secret :');if(v===null)return Promise.resolve(false);
  return derive(v).then(function(d){if(d===SEC.h)return true;warn('Code incorrect.');return false}).catch(function(){alert('Accès indisponible sur ce navigateur.');return false})}
$('menuBtn').onclick=function(){if(busy)return;unlock().then(function(ok){if(ok){$('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false');view()}})};
$('dClose').onclick=function(){$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true')};
$('tabs').onclick=function(e){var t=e.target.getAttribute('data-t');if(t){tab=t;view()}};

function cnt(){var c={};S.rows.forEach(function(r){c[r.pid]=(c[r.pid]||0)+1});return c}
function view(){
  Array.prototype.forEach.call($('tabs').children,function(b){b.classList.toggle('on',b.getAttribute('data-t')===tab)});
  var c=cnt(),o='',act=S.parrains.filter(function(p){return p.on});
  if(tab==='stats'){
    var none=act.filter(function(p){return !c[p.id]}).length,mx=0,mn=null;act.forEach(function(p){var v=c[p.id]||0;if(v>mx)mx=v});
    o='<div class="stats"><div class="stat"><b>'+S.rows.length+'</b>filleuls</div><div class="stat"><b>'+act.length+'</b>parrains actifs</div><div class="stat"><b>'+S.tour+'</b>tour en cours</div><div class="stat"><b>'+S.deck.filter(function(id){var p=par(id);return p&&p.on}).length+'</b>restants ce tour</div><div class="stat"><b>'+none+'</b>sans filleul</div><div class="stat"><b>'+mx+'</b>max par parrain</div></div>';
  }else if(tab==='par'){
    o='<div class="add"><input id="np" placeholder="Nouveau parrain / marraine" maxlength="80"><button class="sm g" data-a="padd">Ajouter</button></div>'+
    S.parrains.map(function(p){return '<div class="item'+(p.on?'':' off')+'"><span class="t">'+esc(p.name)+'</span><span class="cnt">'+(c[p.id]||0)+'</span><button class="sm" data-a="pren" data-i="'+p.id+'">Modifier</button><button class="sm '+(p.on?'r':'g')+'" data-a="ptog" data-i="'+p.id+'">'+(p.on?'Retirer':'Remettre')+'</button></div>'}).join('');
  }else if(tab==='fil'){
    o=S.rows.length?S.rows.map(function(r,i){return '<div class="item"><span class="t">'+(i+1)+'. '+esc(r.filleul)+'<small>→ '+esc(nm(r.pid))+' · tour '+r.tour+'</small></span><button class="sm" data-a="fren" data-i="'+i+'">Modifier</button><button class="sm r" data-a="fred" data-i="'+i+'">Reprendre</button></div>'}).join(''):'<p class="hint">Aucune attribution.</p>';
    o+='<p class="hint">Reprendre : annule l\'attribution, le parrain retourne dans le tirage et le filleul peut relancer.</p>';
  }else if(tab==='exp'){
    o='<button class="big-btn" data-a="csv">Exporter en CSV</button><button class="big-btn" data-a="xls">Exporter en Excel</button><button class="big-btn" data-a="json">Exporter en JSON</button><button class="big-btn" data-a="print">Imprimer / PDF</button>';
  }else{
    o='<button class="big-btn r" data-a="reset">Réinitialiser tout</button>';
  }
  $('dBody').innerHTML=o;
}
function pending(i){return S.deck.indexOf(i)<0}
$('dBody').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;var a=b.getAttribute('data-a'),i=+b.getAttribute('data-i');
  if(a==='padd'){var v=$('np').value.replace(/\s+/g,' ').trim().toUpperCase();if(v.length<2)return;if(S.parrains.some(function(p){return norm(p.name)===norm(v)}))return alert('Déjà dans la liste.');S.parrains.push({id:S.nextId,name:v,on:true});S.deck.splice(rnd(S.deck.length+1),0,S.nextId++)}
  else if(a==='pren'){var p=par(i),v=prompt('Nouveau nom :',p.name);if(v&&v.trim().length>1)p.name=v.replace(/\s+/g,' ').trim().toUpperCase()}
  else if(a==='ptog'){var p=par(i);p.on=!p.on;if(p.on){if(pending(i))S.deck.splice(rnd(S.deck.length+1),0,i)}else S.deck=S.deck.filter(function(x){return x!==i})}
  else if(a==='fren'){var r=S.rows[i],v=prompt('Nom du filleul :',r.filleul);if(v){v=v.replace(/\s+/g,' ').trim();if(v.length<2)return;if(S.rows.some(function(x,k){return k!==i&&norm(x.filleul)===norm(v)}))return alert('Ce nom existe déjà.');r.filleul=v}}
  else if(a==='fred'){var r=S.rows[i];if(!confirm('Reprendre le choix de '+r.filleul+' ?'))return;S.rows.splice(i,1);var p=par(r.pid);if(p&&p.on&&pending(r.pid))S.deck.push(r.pid)}
  else if(a==='csv')return exCsv();else if(a==='xls')return exXls();else if(a==='json')return exJson();else if(a==='print')return exPrint();
  else if(a==='reset'){if(confirm('Effacer toutes les attributions et remettre la liste d\'origine ? Action définitive.')){S=fresh();save()}}
  save();view();
};

/* Export */
function dl(name,mime,content){var b=new Blob([content],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function has(){if(!S.rows.length){alert('Rien à exporter pour le moment.');return false}return true}
function exCsv(){if(!has())return;var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"'},l=[['N°','Filleul','Parrain / Marraine','Tour','Date'].map(q).join(';')];S.rows.forEach(function(r,i){l.push([i+1,r.filleul,nm(r.pid),r.tour,r.at].map(q).join(';'))});dl('parrainage_SRIT1A_'+stamp()+'.csv','text/csv;charset=utf-8','\uFEFF'+l.join('\r\n'))}
function tbl(){return '<table border="1" cellpadding="6" style="border-collapse:collapse"><tr><th>N°</th><th>Filleul</th><th>Parrain / Marraine</th><th>Tour</th><th>Date</th></tr>'+S.rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(r.filleul)+'</td><td>'+esc(nm(r.pid))+'</td><td>'+r.tour+'</td><td>'+esc(r.at)+'</td></tr>'}).join('')+'</table>'}
function exXls(){if(!has())return;dl('parrainage_SRIT1A_'+stamp()+'.xls','application/vnd.ms-excel;charset=utf-8','<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Parrainage SRIT 1A</x:Name></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>'+tbl()+'</body></html>')}
function exJson(){if(!has())return;dl('parrainage_SRIT1A_'+stamp()+'.json','application/json',JSON.stringify(S.rows.map(function(r){return {filleul:r.filleul,parrain:nm(r.pid),tour:r.tour,date:r.at}}),null,2))}
function exPrint(){if(!has())return;$('printArea').innerHTML='<h2>Parrainage SRIT 1A</h2>'+tbl();window.print()}
})();
</script>
</body>
</html>
